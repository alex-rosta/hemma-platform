# ExternalSecrets that pull app credentials from OpenBao
# These create Kubernetes Secrets consumed by Keycloak and Grafana Helm charts.
#
# In OpenBao, create the secrets:
#   bao kv put secret/hemma/cloudflare api-token=<your-cf-api-token>
#   bao kv put secret/hemma/cloudflared-tunnel tunnel-token=<token-from-dashboard>
#   bao kv put secret/hemma/grafana user=admin password=<your-password>
#   bao kv put secret/hemma/keycloak password=<your-password>
#   bao kv put secret/hemma/keycloak-postgresql password=<your-password> postgres-password=<your-password>
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/hemma/cloudflare
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
  namespace: cloudflared
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflared-tunnel-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/hemma/cloudflared-tunnel
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin-password
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/hemma/grafana
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin-password
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-admin-password
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/hemma/keycloak
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-postgresql-password
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-postgresql-password
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: secret/data/hemma/keycloak-postgresql
