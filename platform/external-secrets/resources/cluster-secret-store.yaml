# ClusterSecretStore for OpenBao integration
# Pre-req: OpenBao must be initialized, unsealed, and have a KV-v2 engine at secret/
# Pre-req: The openbao-token secret must be created manually (see bootstrap docs):
#   kubectl -n external-secrets create secret generic openbao-token --from-literal=token=<BAO_TOKEN>
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.openbao:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: openbao-token
          key: token
          namespace: external-secrets
