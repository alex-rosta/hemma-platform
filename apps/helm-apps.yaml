# Upstream Helm charts with local values from platform/<name>/values.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: cert-manager
            namespace: cert-manager
            repoURL: https://charts.jetstack.io
            chart: cert-manager
            version: v1.17.1

          - name: traefik
            namespace: traefik
            repoURL: https://traefik.github.io/charts
            chart: traefik
            version: "34.3.0"

          - name: openbao
            namespace: openbao
            repoURL: https://openbao.github.io/openbao-helm
            chart: openbao
            version: "0.7.0"

          - name: external-secrets
            namespace: external-secrets
            repoURL: https://charts.external-secrets.io
            chart: external-secrets
            version: "0.12.1"

          - name: argocd
            namespace: argocd
            repoURL: https://argoproj.github.io/argo-helm
            chart: argo-cd
            version: "7.8.2"

          - name: keycloak
            namespace: keycloak
            repoURL: registry-1.docker.io/bitnamicharts
            chart: keycloak
            version: "24.4.2"

          - name: monitoring
            namespace: monitoring
            repoURL: https://prometheus-community.github.io/helm-charts
            chart: kube-prometheus-stack
            version: "69.5.2"
  template:
    metadata:
      name: "{{ .name }}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .version }}"
          helm:
            releaseName: '{{ .name }}'
            valueFiles:
              - $values/platform/{{ .name }}/values.yaml
        - repoURL: https://github.com/alex-rosta/hemma-platform.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s
